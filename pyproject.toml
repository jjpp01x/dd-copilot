[project]
name = "dd-copilot"
version = "0.1.0"
description = "Technical due-diligence copilot for deep-tech startups"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "sentence-transformers>=3.0.0",
    "anthropic>=0.34.0",
    "pypdf>=4.0.0",
    "trafilatura>=1.9.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "streamlit>=1.37.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0"]

[project.scripts]
ddcopilot = "dd_copilot.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dd_copilot*"]
